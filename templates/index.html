<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BrickSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: Arial, sans-serif;

      /* Background Image */
      background: url("{{ url_for('static', filename='background.png') }}") no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    /* Dark overlay for readability */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); /* adjust darkness */
      z-index: 0;
    }

    .logo, .card, footer {
      position: relative;
      z-index: 1; /* keep above overlay */
    }

    .logo {
      max-width: 700px;
      width: 100%;
      display: block;
      margin: 20px auto;
    }

    /* Glassmorphism Card */
    .card {
      max-width: 700px;
      width: 100%;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.15); /* transparent white */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; /* white text to contrast */
    }

    .btn-custom {
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-weight: 500;
      border-radius: 0.5rem;
    }

    footer {
      margin-top: 2rem;
      font-size: small;
      color: #eee;
    }

    .heading-main {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 1rem;
    }

    .subtext {
      font-size: 1rem;
      color: #f1f1f1;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="{{ url_for('static', filename='BSbasicboxhightran1.png') }}" alt="BrickSense Logo" class="logo">

  <!-- Card Section -->
  <div class="card text-center">
    <div class="heading-main">Welcome to BrickSense</div>
    <div class="subtext">
      <p><strong>Predict Brick Properties</strong> — flexural load & water absorption</p>
      <p><strong>Detect Brick Wall Cracks</strong> — heatmap + localization</p>
    </div>
    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
      <a href="{{ url_for('predict') }}" class="btn btn-primary btn-custom">Predict Brick Properties</a>
      <a href="{{ url_for('cracks') }}" class="btn btn-primary btn-custom">Detect Wall Cracks</a>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    Developed with TensorFlow | © 2025 BrickSense
  </footer>

</body>
</html>
